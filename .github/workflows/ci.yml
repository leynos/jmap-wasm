name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@122fc392099957575259c97f0599bc3f0f095882
        with:
          install-mold: 'true'
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@122fc392099957575259c97f0599bc3f0f095882
        with:
          version: "0.6.1"

      - name: Format
        run: make check-fmt
      - name: Spelling
        run: make spelling
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Install Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@122fc392099957575259c97f0599bc3f0f095882
      - name: Lint
        run: make lint
      - name: Test and Measure Coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is a
          # measurement, so it takes neither the parallel frontend nor the mold linker.
          # Assigning RUSTFLAGS displaces every `rustflags` table in .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@122fc392099957575259c97f0599bc3f0f095882
        with:
          allow-no-tests: 'true'
          output-path: lcov.info
          format: lcov
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: ${{ env.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@122fc392099957575259c97f0599bc3f0f095882
        with:
          format: lcov
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
